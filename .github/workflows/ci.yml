name: CI

# Build + test on every push to the main branches and on pull requests, so
# breakage is caught before it reaches a release tag (see release.yml).
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          # egui/eframe (X11), cpal (ALSA), rfd (GTK), nokhwa (v4l), udev.
          sudo apt-get install -y \
            libgtk-3-dev \
            libasound2-dev \
            libudev-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libv4l-dev

      # `cargo test` compiles the whole crate, so this doubles as a build check.
      - name: Test
        run: cargo test --locked

      # NOTE: formatting and lint gates are intentionally NOT enforced yet — the
      # tree is not fully rustfmt/clippy-clean (see the TODO in
      # .githooks/pre-commit). Once it is, add these steps:
      #   - run: cargo fmt --all -- --check
      #   - run: cargo clippy --all-targets -- -D warnings
