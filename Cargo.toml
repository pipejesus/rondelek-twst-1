[workspace]
resolver = "2"
members = ["core", "app", "game"]

# `cargo build`/`cargo test` with no `-p` acts on every member — both the
# sampler and the game binary get built together, same as the old single
# crate.
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["pipejesus"]
license = "MIT"
