[package]
name = "rondelek"
version = "0.1.0"
edition = "2024"
default-run = "rondelek"
description = "TWST-1 audio sampler for children with hearing implants"
authors = ["pipejesus"]
license = "MIT"

[dependencies]
eframe = "0.35"
egui = "0.35"
cpal = "0.18"
hound = "3.5"
rustfft = "6"
spectrograms = "2"
non-empty-slice = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ringbuf = "0.4"
anyhow = "1"
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
uuid = { version = "1.23.4", features = ["v4"] }
sys-locale = "0.3.2"
nokhwa = { version = "0.10.11", features = ["input-native"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
raylib = "6.0.0"
