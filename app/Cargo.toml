[package]
name = "rondelek"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "rondelek"
description = "TWST-1 audio sampler for children with hearing implants"

[dependencies]
rondelek-core = { path = "../core" }
eframe = "0.35"
egui = "0.35"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ringbuf = "0.4"
anyhow = "1"
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
nokhwa = { version = "0.10.11", features = ["input-native"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
